# Archived ActivityNet candidate; NOT yet matched to the final 38.80 run.
# Only dataset/output paths were changed for this local release draft.
init_rand_seed: 0
dataset_name: anet
train_split: [training]
val_split: [validation]
dataset: {json_file: ./data/activitynet/annotations/anet1.3_tsp_filtered.json, feat_folder: ./data/activitynet/tsp_features, file_prefix: v_, file_ext: .npy, num_classes: 1, input_dim: 512, feat_stride: 16, num_frames: 16, default_fps: 15, trunc_thresh: 0.5, crop_ratio: [0.9, 1.0], max_seq_len: 768}
model:
  backbone_type: DynE
  fpn_type: identity
  max_buffer_len_factor: 1.0
  backbone_arch: [2, 2, 5]
  n_encoder_win_size: 15
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32], [32, 64], [64, 10000]]
  embd_dim: 256
  mlp_dim: 2048
  fpn_dim: 256
  head_dim: 512
  use_abs_pe: true
  input_noise: 0.7
  k: 1.2
  init_conv_vars: 0.15
  dyn_head_flag: true
  dyn_head: {tau: 1.5, init_gate: 1.0, type: GeReTanH, dyn_type: c}
  head_act: relu
  diffusion_refiner: {enabled: false}
  mamba_adapter: {enabled: true, position: neck_only, backend: dbm, d_state: 16, d_conv: 4, expand: 1, drop_path_rate: 0.3, layer_scale_init: 0.0001, residual_weight: 1.0, use_fast_path: true, tuning_variant: mt0_no_decay, honor_no_weight_decay: true}
  selective_dynamic_scale: {enabled: true, variant: cls_only, reduction: 4, min_hidden_dim: 32, channel_wise: true, temperature: 1.0, selection_gate_init: 0.05, selection_gate_mode: tanh, selection_gate_bound: 0.25, selection_gate_lr_scale: 1.0, preserve_parent_rng: true, active_layers: [0, 1]}
loss: {diffusion_weight: 1.0}
training: {refiner_only: false, freeze_backbone: false, freeze_encoder: false, freeze_cls_branch: false, freeze_reg_branch: false}
opt: {learning_rate: 0.0005, eta_min: 0.00005, warmup_epochs: 5, epochs: 10, weight_decay: 0.05}
loader: {batch_size: 8}
train_cfg: {init_loss_norm: 400, clip_grad_l2norm: 0.4, cls_prior_prob: 0.01, center_sample: radius, center_sample_radius: 1.5, label_smoothing: 0.1}
test_cfg: {voting_thresh: 0.95, pre_nms_topk: 2000, max_seg_num: 200, min_score: 0.001, multiclass_nms: false, nms_sigma: 0.70, ext_score_file: ./data/activitynet/classifiers/new_3ensemble_uniformerv2_large_only_global_anet_16x10x3.json, duration_thresh: 0.1}
output_folder: ./outputs/
